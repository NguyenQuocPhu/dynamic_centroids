########## CONFIGURATION ##########


# Log directory
log_dir: ./logs/mistralai/Ministral-8B-Instruct-2410/AdversarialQA

# Algorithm
algo: rainbowplus
method: all # Ignore this param, only valid for old version

target_llm:
  type_: vllm

  model_kwargs:
    model: mistralai/Mistral-7B-Instruct-v0.2
    trust_remote_code: True
    max_model_len: 2048
    gpu_memory_utilization: 0.3
    enforce_eager: true
  sampling_params:
    temperature: 0.6
    top_p: 0.9
    max_tokens: 1024

# Judge LLM
judge_llm:
  type_: vllm

  model_kwargs:
    model: meta-llama/Llama-Guard-3-8B
    trust_remote_code: True
    max_model_len: 4352
    gpu_memory_utilization: 0.9

  sampling_params:
    temperature: 0.6
    top_p: 0.9
    max_tokens: 16