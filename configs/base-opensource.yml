########## CONFIGURATION ##########

# Archive Configuration
archive: 
  path: [./configs/categories/categories.txt, ./configs/styles/styles.txt]
  descriptor: [Risk Category, Attack Style]

# Seed dataset
sample_prompts: ./data/formatted_harmbench.json

target_llm:
  model_kwargs:
    model: mistralai/Mistral-7B-Instruct-v0.2
    max_model_len: 2048
  sampling_params:
    temperature: 1
    top_p: 1
    max_tokens: 500

mutator_llm:
  model_kwargs:
    model: lmsys/vicuna-13b-v1.5
    max_model_len: 2048
  sampling_params:
    temperature: 1
    top_p: 0.9
    max_tokens: 500

fitness_llm:
  model_kwargs:
    model: Qwen/Qwen2.5-14B-Instruct
  sampling_params:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 10