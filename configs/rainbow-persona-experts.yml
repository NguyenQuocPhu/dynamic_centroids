log_dir: ./logs-official-rainbow-persona-experts
algorithm: rainbowplus
method: combined-fit

target_llm:
  type_: vllm
  model_kwargs:
    model: Qwen/Qwen2.5-7B-Instruct
    gpu_memory_utilization: 0.251
    max_model_len: 510
    enforce_eager: True
  sampling_params:
    temperature: 1
    top_p: 1
    max_tokens: 500

mutator_llm:
  type_: vllm
  model_kwargs:
    model: lmsys/vicuna-13b-v1.5
    gpu_memory_utilization: 0.34
    max_model_len: 510
    enforce_eager: True
  sampling_params:
    temperature: 1
    top_p: 0.9
    max_tokens: 500

fitness_llm:
  type_: vllm
  model_kwargs:
    model: Qwen/Qwen2.5-14B-Instruct
    gpu_memory_utilization: 0.35
    max_model_len: 510
    enforce_eager: True
  sampling_params:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 10

sample_prompts: ./data/harmbench.json
num_samples: 150
max_iters: 80
sim_threshold: 0.6
num_mutations: 10
fitness_threshold: 0.6
log_interval: 50
shuffle: true

mutation_strategy: combined-fit
persona_config: configs/personas/experts.yml
persona_type: RedTeamingExperts

# Include categories, styles, and personas in the archive
archive:
  path: 
    - ./configs/categories/categories.txt
    - ./configs/styles/styles.txt
    - ./configs/personas/experts.yml
  descriptor:
    - Category
    - Style
    - Persona