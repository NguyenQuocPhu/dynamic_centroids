########## CONFIGURATION ##########

# Archive Configuration
archive: 
  path: [./configs/categories/categories.txt, ./configs/styles/styles.txt]
  descriptor: [Risk Category, Attack Style]

# Seed dataset
sample_prompts: ./data/formatted_harmbench.json

target_llm:
  model_kwargs:
    model: Qwen/Qwen2.5-0.5B-Instruct
    max_model_len: 2048
    gpu_memory_utilization: 0.2 # Giảm xuống
    enforce_eager: True        # Tắt CUDA Graph để tiết kiệm ~0.5GB
  sampling_params:
    temperature: 1
    top_p: 1
    max_tokens: 500

mutator_llm:
  model_kwargs:
    model: lmsys/vicuna-7b-v1.5
    max_model_len: 2048
    gpu_memory_utilization: 0.35 # Model này nặng hơn 0.5B một chút
    enforce_eager: True
  sampling_params:
    temperature: 1
    top_p: 0.9
    max_tokens: 500

fitness_llm:
  model_kwargs:
    model: Qwen/Qwen2.5-0.5B-Instruct
    max_model_len: 2048
    gpu_memory_utilization: 0.2 # Model này nặng nhất trong 3 cái
    enforce_eager: True
  sampling_params:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 10