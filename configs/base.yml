########## CONFIGURATION ##########

# Archive Configuration
archive: 
  path: [./configs/categories/categories.txt, ./configs/styles/styles.txt]
  descriptor: [Risk Category, Attack Style]

# Seed dataset
sample_prompts: ./data/formatted_do-not-answer.json

target_llm:
  model_kwargs:
    model: Qwen/Qwen2.5-7B-Instruct
    gpu_memory_utilization: 0.21
    max_model_len: 2048
    enforce_eager: True
    max_num_seqs: 16
  sampling_params:
    temperature: 1
    top_p: 1
    max_tokens: 500

mutator_llm:
  model_kwargs:
    model: lmsys/vicuna-13b-v1.5
    gpu_memory_utilization: 0.357
    max_model_len: 2048
    enforce_eager: True
    max_num_seqs: 16
  sampling_params:
    temperature: 1
    top_p: 0.9
    max_tokens: 500

fitness_llm:
  model_kwargs:
    model: Qwen/Qwen2.5-14B-Instruct
    gpu_memory_utilization: 0.38
    max_model_len: 2048
    enforce_eager: True
    max_num_seqs: 16
  sampling_params:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 10
    logprobs: 1

